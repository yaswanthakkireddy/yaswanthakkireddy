name: Verify live GitHub profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - assets/**
      - scripts/verify_profile.mjs
      - .github/workflows/verify-profile.yml

permissions:
  contents: read

concurrency:
  group: verify-live-profile
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out profile source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned browser tooling
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Check the public profile and capture screenshots
        run: node scripts/verify_profile.mjs
      - name: Preserve screenshots and the verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-verification
          path: profile-verification/
          if-no-files-found: warn
          retention-days: 14
