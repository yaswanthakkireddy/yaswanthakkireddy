<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d"><title id="t">Reliability-first agent loop</title><desc id="d">Query, retrieve, reason, verify, act — with a critic and evaluation gate, a revise loop, and an audit trace under every step.</desc><defs>
