<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="t d"><title id="t">CarbonLedgerX — Climate Risk Intelligence</title><desc id="d">Estimates how likely a company is to miss its climate target, combining eGRID, DEFRA and SBTi data with forecasts and reconciled risk scores.</desc><defs>
