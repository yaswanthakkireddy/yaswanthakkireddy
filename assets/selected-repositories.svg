<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="694" viewBox="0 0 1200 694" role="img"><title>Selected repositories — six AI engineering systems</title><defs><linearGradient id="card" x2="1" y2="1"><stop stop-color="#102b40"/><stop offset="1" stop-color="#07141f"/></linearGradient></defs><rect x="1" y="1" width="588" height="216" rx="18" fill="url(#card)" stroke="#53bfff" stroke-opacity=".35"/><path d="M20 51H570" stroke="#9ff5d5" stroke-opacity=".13"/><text x="22" y="31" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#9ff5d5">01 / AGENT ACTION SAFETY</text><text x="22" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#eafaff">TOSCO</text><text x="22" y="131" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#aec4d5">Typed evidence, deterministic gates</text><text x="22" y="162" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#aec4d5">and token-bound mock-bank execution.</text><text x="22" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#53bfff">FastAPI · Pydantic · React</text><text x="548" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400" fill="#9ff5d5">↗</text><rect x="20" y="213" width="50" height="2" rx="1" fill="#9ff5d5"><animate attributeName="x" values="20;520;20" dur="7s" repeatCount="indefinite"/></rect><rect x="611" y="1" width="588" height="216" rx="18" fill="url(#card)" stroke="#53bfff" stroke-opacity=".35"/><path d="M630 51H1180" stroke="#9ff5d5" stroke-opacity=".13"/><text x="632" y="31" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#9ff5d5">02 / AGENTIC RAG</text><text x="632" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#eafaff">CortexAgent</text><text x="632" y="131" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#aec4d5">SEC 10-K research with hybrid retrieval</text><text x="632" y="162" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#aec4d5">and critic-gated agent revision.</text><text x="632" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#53bfff">LangGraph · RAGAS · FastAPI</text><text x="1158" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400" fill="#9ff5d5">↗</text><rect x="630" y="213" width="50" height="2" rx="1" fill="#9ff5d5"><animate attributeName="x" values="630;1130;630" dur="8s" repeatCount="indefinite"/></rect><rect x="1" y="239" width="588" height="216" rx="18" fill="url(#card)" stroke="#53bfff" stroke-opacity=".35"/><path d="M20 289H570" stroke="#9ff5d5" stroke-opacity=".13"/><text x="22" y="269" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#9ff5d5">03 / SQL MIGRATION ANALYSIS</text><text x="22" y="329" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#eafaff">MigrationLens</text><text x="22" y="369" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#aec4d5">Deterministic-first migration checks</text><text x="22" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#aec4d5">with SQL parsing and SARIF reports.</text><text x="22" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#53bfff">Python · sqlglot · PostgreSQL</text><text x="548" y="329" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400" fill="#9ff5d5">↗</text><rect x="20" y="451" width="50" height="2" rx="1" fill="#9ff5d5"><animate attributeName="x" values="20;520;20" dur="9s" repeatCount="indefinite"/></rect><rect x="611" y="239" width="588" height="216" rx="18" fill="url(#card)" stroke="#53bfff" stroke-opacity=".35"/><path d="M630 289H1180" stroke="#9ff5d5" stroke-opacity=".13"/><text x="632" y="269" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#9ff5d5">04 / GRAPH LEARNING</text><text x="632" y="329" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#eafaff">NeuroShield</text><text x="632" y="369" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#aec4d5">Transaction-graph research with</text><text x="632" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#aec4d5">temporal evaluation and explanations.</text><text x="632" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#53bfff">PyTorch Geometric · GraphSAGE</text><text x="1158" y="329" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400" fill="#9ff5d5">↗</text><rect x="630" y="451" width="50" height="2" rx="1" fill="#9ff5d5"><animate attributeName="x" values="630;1130;630" dur="10s" repeatCount="indefinite"/></rect><rect x="1" y="477" width="588" height="216" rx="18" fill="url(#card)" stroke="#53bfff" stroke-opacity=".35"/><path d="M20 527H570" stroke="#9ff5d5" stroke-opacity=".13"/><text x="22" y="507" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#9ff5d5">05 / EXPLAINABLE CREDIT RISK</text><text x="22" y="567" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#eafaff">FairLend</text><text x="22" y="607" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#aec4d5">Credit modelling, SHAP explanations</text><text x="22" y="638" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#aec4d5">and scoped fairness evaluation.</text><text x="22" y="670" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#53bfff">LightGBM · SHAP · Fairlearn</text><text x="548" y="567" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400" fill="#9ff5d5">↗</text><rect x="20" y="689" width="50" height="2" rx="1" fill="#9ff5d5"><animate attributeName="x" values="20;520;20" dur="11s" repeatCount="indefinite"/></rect><rect x="611" y="477" width="588" height="216" rx="18" fill="url(#card)" stroke="#53bfff" stroke-opacity=".35"/><path d="M630 527H1180" stroke="#9ff5d5" stroke-opacity=".13"/><text x="632" y="507" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#9ff5d5">06 / MODEL OBSERVABILITY</text><text x="632" y="567" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#eafaff">ModelWatch</text><text x="632" y="607" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#aec4d5">Drift, model decay and a</text><text x="632" y="638" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#aec4d5">champion–challenger monitoring loop.</text><text x="632" y="670" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#53bfff">PSI / KS · SHAP drift</text><text x="1158" y="567" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400" fill="#9ff5d5">↗</text><rect x="630" y="689" width="50" height="2" rx="1" fill="#9ff5d5"><animate attributeName="x" values="630;1130;630" dur="12s" repeatCount="indefinite"/></rect></svg>
