<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img"><title>System map — orchestration, decision systems and reliability tooling</title><defs><linearGradient id="mapbg" x2="1" y2="1"><stop stop-color="#080d1c"/><stop offset="1" stop-color="#141026"/></linearGradient></defs><rect x="1" y="1" width="1198" height="298" rx="24" fill="url(#mapbg)" stroke="#796898" stroke-opacity=".5"/><text x="30" y="47" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#a48bff">THE SYSTEM MAP</text><rect x="30" y="80" width="360" height="180" rx="14" fill="#ffffff" fill-opacity=".03" stroke="#25e0e8" stroke-opacity=".25"/><rect x="30" y="98" width="3" height="144" rx="1.5" fill="#25e0e8"/><text x="50" y="113" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#25e0e8">01 / ORCHESTRATION</text><text x="50" y="155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#f6f4ff">CortexAgent · TOSCO</text><text x="50" y="191" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#bbc6dc">Retrieval and agent workflows</text><text x="50" y="220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#bbc6dc">Evidence-bound tool execution</text><rect x="420" y="80" width="360" height="180" rx="14" fill="#ffffff" fill-opacity=".03" stroke="#b298ff" stroke-opacity=".25"/><rect x="420" y="98" width="3" height="144" rx="1.5" fill="#b298ff"/><text x="440" y="113" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#b298ff">02 / DECISION SYSTEMS</text><text x="440" y="155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#f6f4ff">NeuroShield · FairLend</text><text x="440" y="191" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#bbc6dc">Graph learning and credit risk</text><text x="440" y="220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#bbc6dc">Explanations + scoped evaluation</text><rect x="810" y="80" width="360" height="180" rx="14" fill="#ffffff" fill-opacity=".03" stroke="#ffbc72" stroke-opacity=".25"/><rect x="810" y="98" width="3" height="144" rx="1.5" fill="#ffbc72"/><text x="830" y="113" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#ffbc72">03 / RELIABILITY TOOLING</text><text x="830" y="155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#f6f4ff">MigrationLens</text><text x="830" y="191" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#bbc6dc">ExperimentOS · ModelWatch</text><text x="830" y="220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#bbc6dc">Validation, experiments, monitoring</text><text x="30" y="284" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#8998b3">Project evidence and boundaries live in the linked repositories.</text></svg>
