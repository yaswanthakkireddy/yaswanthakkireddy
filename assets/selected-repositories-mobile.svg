<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1500" viewBox="0 0 600 1500" role="img"><title>Selected repositories — six AI engineering systems</title><defs><linearGradient id="card" x2="1" y2="1"><stop stop-color="#102b40"/><stop offset="1" stop-color="#07141f"/></linearGradient></defs><rect x="1" y="1" width="598" height="233" rx="18" fill="url(#card)" stroke="#53bfff" stroke-opacity=".35"/><path d="M20 51H580" stroke="#9ff5d5" stroke-opacity=".13"/><text x="22" y="31" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#9ff5d5">01 / AGENT ACTION SAFETY</text><text x="22" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" fill="#eafaff">TOSCO</text><text x="22" y="131" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#aec4d5">Typed evidence, deterministic gates</text><text x="22" y="162" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#aec4d5">and token-bound mock-bank execution.</text><text x="22" y="211" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#53bfff">FastAPI · Pydantic · React</text><text x="558" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400" fill="#9ff5d5">↗</text><rect x="20" y="230" width="50" height="2" rx="1" fill="#9ff5d5"><animate attributeName="x" values="20;530;20" dur="7s" repeatCount="indefinite"/></rect><rect x="1" y="254" width="598" height="233" rx="18" fill="url(#card)" stroke="#53bfff" stroke-opacity=".35"/><path d="M20 304H580" stroke="#9ff5d5" stroke-opacity=".13"/><text x="22" y="284" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#9ff5d5">02 / AGENTIC RAG</text><text x="22" y="344" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" fill="#eafaff">CortexAgent</text><text x="22" y="384" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#aec4d5">SEC 10-K research with hybrid retrieval</text><text x="22" y="415" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#aec4d5">and critic-gated agent revision.</text><text x="22" y="464" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#53bfff">LangGraph · RAGAS · FastAPI</text><text x="558" y="344" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400" fill="#9ff5d5">↗</text><rect x="20" y="483" width="50" height="2" rx="1" fill="#9ff5d5"><animate attributeName="x" values="20;530;20" dur="8s" repeatCount="indefinite"/></rect><rect x="1" y="507" width="598" height="233" rx="18" fill="url(#card)" stroke="#53bfff" stroke-opacity=".35"/><path d="M20 557H580" stroke="#9ff5d5" stroke-opacity=".13"/><text x="22" y="537" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#9ff5d5">03 / SQL MIGRATION ANALYSIS</text><text x="22" y="597" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" fill="#eafaff">MigrationLens</text><text x="22" y="637" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#aec4d5">Deterministic-first migration checks</text><text x="22" y="668" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#aec4d5">with SQL parsing and SARIF reports.</text><text x="22" y="717" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#53bfff">Python · sqlglot · PostgreSQL</text><text x="558" y="597" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400" fill="#9ff5d5">↗</text><rect x="20" y="736" width="50" height="2" rx="1" fill="#9ff5d5"><animate attributeName="x" values="20;530;20" dur="9s" repeatCount="indefinite"/></rect><rect x="1" y="760" width="598" height="233" rx="18" fill="url(#card)" stroke="#53bfff" stroke-opacity=".35"/><path d="M20 810H580" stroke="#9ff5d5" stroke-opacity=".13"/><text x="22" y="790" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#9ff5d5">04 / GRAPH LEARNING</text><text x="22" y="850" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" fill="#eafaff">NeuroShield</text><text x="22" y="890" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#aec4d5">Transaction-graph research with</text><text x="22" y="921" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#aec4d5">temporal evaluation and explanations.</text><text x="22" y="970" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#53bfff">PyTorch Geometric · GraphSAGE</text><text x="558" y="850" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400" fill="#9ff5d5">↗</text><rect x="20" y="989" width="50" height="2" rx="1" fill="#9ff5d5"><animate attributeName="x" values="20;530;20" dur="10s" repeatCount="indefinite"/></rect><rect x="1" y="1013" width="598" height="233" rx="18" fill="url(#card)" stroke="#53bfff" stroke-opacity=".35"/><path d="M20 1063H580" stroke="#9ff5d5" stroke-opacity=".13"/><text x="22" y="1043" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#9ff5d5">05 / EXPLAINABLE CREDIT RISK</text><text x="22" y="1103" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" fill="#eafaff">FairLend</text><text x="22" y="1143" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#aec4d5">Credit modelling, SHAP explanations</text><text x="22" y="1174" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#aec4d5">and scoped fairness evaluation.</text><text x="22" y="1223" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#53bfff">LightGBM · SHAP · Fairlearn</text><text x="558" y="1103" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400" fill="#9ff5d5">↗</text><rect x="20" y="1242" width="50" height="2" rx="1" fill="#9ff5d5"><animate attributeName="x" values="20;530;20" dur="11s" repeatCount="indefinite"/></rect><rect x="1" y="1266" width="598" height="233" rx="18" fill="url(#card)" stroke="#53bfff" stroke-opacity=".35"/><path d="M20 1316H580" stroke="#9ff5d5" stroke-opacity=".13"/><text x="22" y="1296" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#9ff5d5">06 / MODEL OBSERVABILITY</text><text x="22" y="1356" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" fill="#eafaff">ModelWatch</text><text x="22" y="1396" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#aec4d5">Drift, model decay and a</text><text x="22" y="1427" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#aec4d5">champion–challenger monitoring loop.</text><text x="22" y="1476" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#53bfff">PSI / KS · SHAP drift</text><text x="558" y="1356" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400" fill="#9ff5d5">↗</text><rect x="20" y="1495" width="50" height="2" rx="1" fill="#9ff5d5"><animate attributeName="x" values="20;530;20" dur="12s" repeatCount="indefinite"/></rect></svg>
