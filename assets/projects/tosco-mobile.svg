ans-serif" font-size="21" font-weight="600" fill="#f8f5ff">PAYMENT INTENT</text><text x="104" y="356" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#bac6dd">Agent proposes a transaction.</text><rect x="32" y="389" width="536" height="80" rx="14" fill="#ffffff" fill-opacity=".035" stroke="#FF4B2E" stroke-opacity=".3"/><text x="48" y="421" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#ffd537">02</text><text x="104" y="421" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#f8f5ff">DETERMINISTIC GATES</text><text x="104" y="450" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#bac6dd">Evidence · policy · risk · reality</text><rect x="32" y="483" width="536" height="80" rx="14" fill="#ffffff" fill-opacity=".035" stroke="#FF4B2E" stroke-opacity=".3"/><text x="48" y="515" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#ffd537">03</text><text x="104" y="515" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#f8f5ff">SEALED PROOF</text><text x="104" y="544" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#bac6dd">SHA256 proof chain + HMAC token</text><rect x="32" y="577" width="536" height="80" rx="14" fill="#ffffff" fill-opacity=".035" stroke="#FF4B2E" stroke-opacity=".3"/><text x="48" y="609" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#ffd537">04</text><text x="104" y="609" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#f8f5ff">MOCK-BANK EXECUTION</text><text x="104" y="638" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#bac6dd">Only an ALLOW token can proceed.</text><text x="32" y="713" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#00c8ff">ALLOW  /  BLOCK  /