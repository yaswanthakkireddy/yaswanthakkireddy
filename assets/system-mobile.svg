<svg xmlns="http://www.w3.org/2000/svg" width="600" height="620" viewBox="0 0 600 620" role="img"><title>System map — orchestration, decision systems and reliability tooling</title><defs><linearGradient id="mapbg" x2="1" y2="1"><stop stop-color="#07141f"/><stop offset="1" stop-color="#0b0c13"/></linearGradient></defs><rect x="1" y="1" width="598" height="618" rx="24" fill="url(#mapbg)" stroke="#9FF5D5" stroke-opacity=".5"/><text x="30" y="47" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#9ff5d5">THE SYSTEM MAP</text><rect x="30" y="76" width="540" height="155" rx="14" fill="#ffffff" fill-opacity=".03" stroke="#53bfff" stroke-opacity=".25"/><rect x="30" y="94" width="3" height="119" rx="1.5" fill="#53bfff"/><text x="50" y="109" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#53bfff">01 / ORCHESTRATION</text><text x="50" y="151" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#f6f4ff">CortexAgent · TOSCO</text><text x="50" y="187" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#bbc6dc">Retrieval and agent workflows</text><text x="50" y="216" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#bbc6dc">Evidence-bound tool execution</text><rect x="30" y="250" width="540" height="155" rx="14" fill="#ffffff" fill-opacity=".03" stroke="#9ff5d5" stroke-opacity=".25"/><rect x="30" y="268" width="3" height="119" rx="1.5" fill="#9ff5d5"/><text x="50" y="283" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#9ff5d5">02 / DECISION SYSTEMS</text><text x="50" y="325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#f6f4ff">NeuroShield · FairLend</text><text x="50" y="361" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#bbc6dc">Graph learning and credit risk</text><text x="50" y="390" font-